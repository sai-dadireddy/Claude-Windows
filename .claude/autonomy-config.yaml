# Autonomy Configuration for Claude Code
# Controls safety boundaries and autonomous behavior

git_safety:
  # Block destructive git operations
  block_force_push: true
  block_reset_hard: true
  block_clean_fd: true

  # Require confirmation for these operations
  require_confirmation:
    - push to main/master
    - delete branch
    - rebase
    - merge

  # Safe operations (no confirmation needed)
  allow_without_confirmation:
    - commit
    - push to feature branches
    - pull
    - fetch
    - checkout
    - create branch

file_safety:
  # Never auto-delete these patterns
  protected_patterns:
    - "*.env*"
    - "*credentials*"
    - "*secret*"
    - "*.pem"
    - "*.key"

  # Require confirmation before deleting
  confirm_delete_dirs:
    - node_modules
    - .git
    - dist
    - build

autonomous_mode:
  # Max files to edit without checkpoint
  max_edits_before_checkpoint: 10

  # Always pause for these file types
  pause_for_review:
    - "*.yaml"
    - "*.yml"
    - "*.json"
    - "terraform/*"
    - "*.tf"

  # Auto-run these without asking
  auto_approve:
    - lint
    - format
    - type-check
    - unit tests

delegation:
  # Criteria for spawning subagents
  spawn_threshold:
    files_affected: 3
    estimated_complexity: medium

  # Labels to auto-add for delegated tasks
  default_labels:
    - pilot
    - autonomous
